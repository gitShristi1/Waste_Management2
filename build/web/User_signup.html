<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoCycle - User Sign Up</title>

    <link rel="stylesheet" href="User_signup.css">

</head>


<body>

    <div class="signup-container">

        <div class="signup-card">

            <!-- Logo -->

            <div class="logo">

                <span class="logo-icon">♻</span>

                Eco<span>Cycle</span>

            </div>


            <!-- Heading -->

            <h1>Create Account</h1>

            <p class="subtitle">
                Join EcoCycle and make a difference
            </p>


            <!-- Sign Up Form -->

            <form action="Insert_user" method="post" name="signup" >


                <!-- Full Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your address"
                        required
                    ></textarea>

                </div>


                <!-- Contact Number -->

                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="Enter your contact number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Submit Button -->

                <input 
                    type="submit"
                    class="signup-button"
                    value="Submit"
                >
                    Sign Up
                


            </form>


            <!-- Sign In -->

            <p class="signin-text">

                Already have an account?

                <a href="User_signin.html">
                    Sign In
                </a>

            </p>


            <!-- Forgot Password -->

            <a
                href="Forgot_Pass.html"
                class="forgot-password"
            >
                Forgot Password?
            </a>


            <!-- Back -->

            <a
                href="page1.html"
                class="back-link"
            >
                ← Back
            </a>

        </div>

    </div>

</body>

</html>
