<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EcoCycle - Forgot Password</title>

    <link rel="stylesheet" href="forget_password.css">

</head>

<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <span class="logo-icon">
                &#9851;
            </span>

            <span>
                <font color="black">Eco</font><font color="green">Cycle</font>
            </span>

        </div>


        <nav class="navbar">

            <a href="Landing.html">Home</a>

            <a href="#">About</a>

            <a href="#">Services</a>

            <a href="#">Contact</a>

        </nav>

    </header>


    <!-- ================= FORM SECTION ================= -->

    <section class="form-section">

        <div class="form-card">


            <!-- ================= HEADING ================= -->

            <div class="form-heading">

                <div class="form-icon">
                    &#9851;
                </div>

                <h1>
                    Forgot <span>Password?</span>
                </h1>

                <p>
                    Enter your Company ID to reset your password.
                </p>

            </div>


            <!-- ================= FORM ================= -->

            <form method="post" action="forget_password">


                <!-- COMPANY ID -->

                <div class="form-group">

                    <label>
                        Company ID
                    </label>

                    <input
                        type="text"
                        name="regno"
                        placeholder="Enter company registration number"
                        required>

                </div>


                <!-- BUTTONS -->

                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Submit"
                        class="submit-btn">

                    <input
                        type="reset"
                        value="Reset"
                        class="reset-btn">

                </div>


            </form>


            <!-- ================= BACK ================= -->

            <div class="back">

                <a href="companySignin.html">
                    &#8592; Back to Sign In
                </a>

            </div>


        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 EcoWaste Management System
        | Building a Cleaner Future &#9851;

    </footer>


</body>

</html>
