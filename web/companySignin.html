<!DOCTYPE html>
<html>
<head>
    <title>EcoWaste - Company Sign In</title>

    <link rel="stylesheet" href="companySignin.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">

            <span class="logo-icon">&#9851;</span>

            <span>
                <font color="black">Eco</font><font color="green">Cycle</font>
            </span>

        </div>


        <nav class="navbar">

            <a href="Landing.html">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>

        </nav>

    </header>


    <!-- SIGN IN SECTION -->
    <section class="form-section">

        <div class="form-card">

            <!-- FORM HEADING -->
            <div class="form-heading">

                <div class="form-icon">
                    &#9851;
                </div>

                <h1>
                    Company <span>Sign In</span>
                </h1>

                <p>
                    Sign in to access your EcoCycle company account.
                </p>

            </div>


            <!-- SIGN IN FORM -->
            <form method="post" action="companySignin">

                <!-- EMAIL -->
                <div class="form-group">

                    <label>Company ID</label>

                    <input
                        type="text"
                        name="regno"
                        placeholder="Enter company id"
                        required>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <!-- FORGOT PASSWORD -->
                <div class="forgot-password">

                    <a href="forget_password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- SUBMIT -->
                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Sign In"
                        class="submit-btn">

                </div>


                <!-- SIGN UP -->
                <div class="signup-text">

                    Don't have an account?

                    <a href="companySignup.html">
                        Sign Up
                    </a>

                </div>


                <!-- BACK -->
                <div class="back">

                    <a
                href="page1.html"
                class="back-link"
            >
                &#8592; Back
            </a>

                </div>

            </form>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

        © 2026 EcoWaste Management System
        | Building a Cleaner Future &#9851;

    </footer>

</body>
</html>
